<br>
    <input type="radio" name="m2" id="m2r1">
    <input type="radio" name = "m2" id = "m2r2">

    <button onclick="prueba()">hola</button>

    <script>
        function prueba (){
            const seleccionado = document.querySelector("input[name=m1]:checked");
            
            
            if(seleccionado === null){
                localStorage.setItem("m1", "");
                console.log("no eligió")
            }else{
                localStorage.setItem("m1", seleccionado.value);
                console.log(seleccionado)
            }
        
        }
        
        
    </script>
